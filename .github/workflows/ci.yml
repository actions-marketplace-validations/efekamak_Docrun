name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: npm run catalog:validate
      - name: Direct tool smoke test (passing fixture)
        run: npx --yes "@grok/agent-sdk@0.7.2" tool call run_quickstart --dir . --input '{"contractPath":"fixtures/passing/docrun.json"}'
      - name: List evals
        run: npx --yes "@grok/agent-sdk@0.7.2" eval --dir . --list
