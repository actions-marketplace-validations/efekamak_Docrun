name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: node --check site/app.js
      - run: npm test
      - run: npm run validate
      - run: npm run catalog:validate
      - name: Direct tool smoke test (passing fixture)
        shell: bash
        run: npx --no-install agent-sdk tool call run_quickstart --dir . --input '{"contractPath":"fixtures/passing/docrun.json"}'
      - name: List evals
        shell: bash
        run: npx --no-install agent-sdk eval --dir . --list
      - name: Static site build smoke (no third-party installs, no network)
        run: |
          npm run status:aggregate -- --no-history-fetch --out-dir=generated
          npm run site:build
