name: Live Quickstart Status

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: "pages-status"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run catalog:validate
      - run: npm run catalog:run -- --platform=ubuntu --out=generated/platform-ubuntu.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-ubuntu
          path: generated/platform-ubuntu.json
          if-no-files-found: ignore
          retention-days: 1

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run catalog:validate
      - run: npm run catalog:run -- --platform=windows --concurrency=1 --out=generated/platform-windows.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-windows
          path: generated/platform-windows.json
          if-no-files-found: ignore
          retention-days: 1

  aggregate-and-build:
    needs: [check-ubuntu, check-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run catalog:validate

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: platform-ubuntu
          path: generated/artifacts/ubuntu

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: platform-windows
          path: generated/artifacts/windows

      - name: Aggregate platform results, history, and badges
        env:
          UBUNTU_JOB_RESULT: ${{ needs.check-ubuntu.result }}
          WINDOWS_JOB_RESULT: ${{ needs.check-windows.result }}
        run: >
          npm run status:aggregate --
          --ubuntu=generated/artifacts/ubuntu/platform-ubuntu.json
          --windows=generated/artifacts/windows/platform-windows.json
          --ubuntu-job-result="${UBUNTU_JOB_RESULT}"
          --windows-job-result="${WINDOWS_JOB_RESULT}"
          --history-url=https://efekamak.github.io/Docrun/history.json
          --out-dir=generated

      - run: npm run site:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site

  deploy:
    needs: aggregate-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
