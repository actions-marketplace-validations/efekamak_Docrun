name: Live Quickstart Status

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: "pages-status"
  cancel-in-progress: false

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run catalog:validate
      - run: npm run catalog:run
      - run: npm run site:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: check-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
